<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBAB Room Guide — Rixos Bab Al Bahr</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="wordmark">RBAB <span class="accent">Room Guide</span></div>
        <div class="tagline">Rixos Bab Al Bahr · Rooms Controller Reference</div>
      </div>

      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Go to room #" inputmode="numeric">
      </div>
    </div>

    <div class="building-tabs" id="buildingTabs"></div>

    <div class="floor-tabs-wrap">
      <div class="floor-tabs" id="floorTabs"></div>
    </div>
  </header>

  <div class="body-wrap">
    <main class="plan-col">
      <div class="floor-summary">
        <h2 id="floorTitle">—</h2>
        <div class="stat"><b id="roomCount">0</b> rooms</div>
        <div class="stat"><b id="connectCount">0</b> interconnecting</div>
        <div class="stat warn" id="photoStat" style="display:none"><b id="noPhotoCount">0</b> awaiting photos</div>
      </div>

      <div class="plan-frame">
        <span class="tick-br"></span><span class="tick-bl"></span>
        <div class="grid" id="grid"></div>
        <div class="legend" id="legend"></div>
      </div>
    </main>

    <aside class="detail-col">
      <div class="detail-empty" id="detailEmpty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        <div id="detailHint">Hover over a room on the plan<br>to see its view and features.</div>
      </div>

      <div class="detail-room" id="detailRoom">
        <div class="detail-head">
          <h2>Room <span id="dRoomNum"></span></h2>
          <span class="type-pill" id="dTypePill"></span>
        </div>
        <div class="detail-desc" id="dDesc"></div>

        <div class="photo-frame" id="dPhoto"></div>

        <div class="section-label">Room Features</div>
        <div class="feature-tags" id="dTags"></div>

        <div class="section-label">Interconnecting Room</div>
        <div class="connect-box" id="dConnect"></div>
      </div>
    </aside>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lbImg" src="" alt="">
  <div class="lb-caption" id="lbCaption"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
